name: Publish catalog to GitHub Pages

on:
  push:
    branches: [main]
    paths: [catalog.json, index.html, .nojekyll, .github/workflows/pages.yml, .github/scripts/check-published-catalog.sh]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      reconcile:
        description: Deploy only if the public catalog differs from main
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: catalog-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Compare the public catalog with main
        id: public
        if: github.event_name == 'schedule' || inputs.reconcile
        run: |
          if bash .github/scripts/check-published-catalog.sh; then
            echo "The public catalog already matches main."
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "The public catalog is stale or unavailable. Redeploying main."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate and prepare public files
        if: steps.public.outputs.current != 'true'
        run: |
          python3 - <<'PY'
          import json
          from urllib.parse import urlsplit
          with open('catalog.json') as f:
              c = json.load(f)
          assert c['version'] == 1 and 1 <= len(c['stations']) <= 500
          assert len({s['id'] for s in c['stations']}) == len(c['stations'])
          for s in c['stations']:
              assert s['streams']
              for stream in s['streams']:
                  assert stream['format'] in ('hls', 'aac', 'mp3')
                  for field in ('url', 'source'):
                      u = urlsplit(stream[field])
                      assert u.scheme == 'https' and u.hostname and not u.username and not u.password
          PY
          mkdir _site
          cp catalog.json index.html .nojekyll _site/
      - uses: actions/configure-pages@v5
        if: steps.public.outputs.current != 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.public.outputs.current != 'true'
        with:
          path: _site
      - name: Deploy
        if: steps.public.outputs.current != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the deployed catalog
        if: steps.public.outputs.current != 'true'
        run: |
          for attempt in {1..6}; do
            if bash .github/scripts/check-published-catalog.sh; then
              echo "GitHub Pages is serving the catalog from this commit."
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 10
            fi
          done
          echo "::error::The public catalog still differs from the deployed commit."
          exit 1
